# Publie l'app sur EAS Update (Expo Go) depuis GitHub Actions.
# Déclenchement manuel : le token Expo est passé en input, masqué dans les
# logs, utilisé une seule fois et jamais stocké.
name: EAS Update

on:
  workflow_dispatch:
    inputs:
      expo_token:
        description: 'Token Expo (expo.dev/settings/access-tokens)'
        required: true
        type: string
      message:
        description: 'Message de publication'
        required: false
        default: 'Publication TisStan'
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Masquer le token dans les logs
        run: echo "::add-mask::${{ github.event.inputs.expo_token }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lier le projet EAS
        env:
          EXPO_TOKEN: ${{ github.event.inputs.expo_token }}
        run: npx eas-cli@latest init --non-interactive --force

      - name: Publier la mise à jour
        env:
          EXPO_TOKEN: ${{ github.event.inputs.expo_token }}
        run: npx eas-cli@latest update --branch main --message "${{ github.event.inputs.message }}" --non-interactive

      - name: Committer le projectId EAS si modifié
        run: |
          if ! git diff --quiet app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore: link EAS project id"
            git push
          fi
