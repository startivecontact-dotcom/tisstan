# Publie l'app sur EAS Update (Expo Go) depuis GitHub Actions.
# Se déclenche à chaque push sur la branche `eas-publish` (ou manuellement).
# Le token Expo est lu depuis le secret de dépôt EXPO_TOKEN :
# GitHub → Settings → Secrets and variables → Actions → EXPO_TOKEN.
name: EAS Update

on:
  push:
    branches: [eas-publish]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier le token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN introuvable. Ajoutez-le dans Settings → Secrets and variables → Actions → onglet Secrets (pas Variables) → New repository secret."
            exit 1
          fi
          echo "Token présent ✓"

      - name: Lier le projet EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
        run: npx eas-cli@latest init --non-interactive --force

      - name: Publier la mise à jour
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
          # Clé Gemini injectée dans le bundle au moment de l'export
          # (coach IA + analyse des repas + scan photo).
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx eas-cli@latest update --branch main --message "Publication TisStan 🐺🐰" --non-interactive
