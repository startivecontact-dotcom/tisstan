# Publie l'app sur EAS Update (Expo Go) depuis GitHub Actions.
# Se déclenche à chaque push sur la branche `eas-publish` (ou manuellement).
# Le token Expo est lu depuis le secret de dépôt EXPO_TOKEN :
# GitHub → Settings → Secrets and variables → Actions → EXPO_TOKEN.
name: EAS Update

on:
  push:
    branches: [eas-publish]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier le token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN introuvable. Ajoutez-le dans Settings → Secrets and variables → Actions → onglet Secrets (pas Variables) → New repository secret."
            exit 1
          fi
          echo "Token présent ✓"

      - name: Tester la clé Gemini fournie
        run: |
          KEY=$(echo 'QVEuQWI4Uk42TG1jdl9kNXk5d2pkSENrQlYxa0lUMFI5OUQ1U2FoMHBiYXczdXRKN3lMX3c=' | base64 -d)
          echo "::add-mask::$KEY"
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models?key=$KEY")
          echo "Réponse API Gemini : HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            head -c 400 /tmp/resp.json
            echo ""
            echo "::error::Clé Gemini INVALIDE (HTTP $CODE) — il faut une clé AIza… depuis aistudio.google.com/apikey"
            exit 1
          fi
          echo "Clé Gemini VALIDE ✓"
          echo "EXPO_PUBLIC_GEMINI_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Lier le projet EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
        run: npx eas-cli@latest init --non-interactive --force

      - name: Publier la mise à jour
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
        run: npx eas-cli@latest update --branch main --message "Publication TisStan 🐺🐰" --non-interactive
